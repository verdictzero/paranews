  # ── Reddit, by the only route Reddit permits ──
  # reddit.com/robots.txt is "User-agent: * / Disallow: /" on every host it
  # serves, .rss included, and Reddit's API rules ban browser-UA spoofing, so
  # the old scraped feeds are gone for good. This uses the sanctioned
  # application-only OAuth route instead. It needs REDDIT_CLIENT_ID and
  # REDDIT_CLIENT_SECRET (repository secrets); without them the source is
  # skipped, never failed, so a fork with no Reddit app still builds.
  # Reddit's unauthenticated budget is ~1 request/minute per IP, which an
  # Actions runner shares with every other tenant in its Azure range — that is
  # what the old 429s were, and no amount of backoff would have fixed it.
  - id: reddit-ufo
    name: Reddit
    kind: reddit
    subreddits: [UFOs, UFOB, ufo]
    tier: unverified
    topics: [ufo]
    min_score: 25
    min_self_score: 250
    enabled: true
    note: >-
      A post linking to a publisher is filed under that publisher and graded by
      its tier; a self post stays unverified and needs heavy community
      endorsement, because most of a subreddit's new queue is anecdote.
  - id: reddit-strange
    name: Reddit
    kind: reddit
    subreddits: [HighStrangeness, Paranormal, bigfoot, Ghosts]
    tier: unverified
    topics: auto
    min_score: 50
    min_self_score: 500
    enabled: true
    note: Anecdote-heavy, so the bar is higher and unclassified titles are dropped.



  # ── Scholarly and institutional: the sources that can fill the official tier ──
  # Measured on 2026-09-08 by running the repo's own classifier over every
  # fetched title. General institutional feeds were probed and rejected: DoD,
  # GAO, NASA, ESA, Nature, Science, PNAS, PLOS ONE and gov.uk MOD scored 0
  # on-beat across 348 titles between them. The official tier can only be filled
  # by feeds that are on-beat by construction, and it will stay small.
  - id: conversation-ufos
    name: The Conversation
    kind: rss
    url: https://theconversation.com/us/topics/ufos-129746/articles.atom
    tier: official
    topics: auto
    enabled: true
    note: >-
      Per-topic Atom feed; 19/25 on beat where the general edition feed scored
      0/50. The publisher is already in publishers.official.
  - id: conversation-paranormal
    name: The Conversation
    kind: rss
    url: https://theconversation.com/us/topics/paranormal-21949/articles.atom
    tier: official
    topics: auto
    enabled: true
    note: The /topics/ghosts-*/ and /topics/bigfoot-*/ feeds exist but are stale.
  - id: arxiv-uap
    name: arXiv
    kind: rss
    url: https://export.arxiv.org/api/query?search_query=abs:%22unidentified+anomalous+phenomena%22+OR+abs:%22unidentified+aerial+phenomena%22+OR+abs:%22unidentified+flying+object%22&sortBy=submittedDate&sortOrder=descending&max_results=30
