  entertainment_patterns:
    - '\b(?:movies?|films?|cinema|screen ?rant|comics?|anime|manga|otaku|gaming|game ?(?:rant|daily|spot|informer)|theatre|theater|broadway|playbill|fandom|geek|nerd|horror)\b'
  patterns:
    # Government, universities, journals
    - tier: official
      pattern: '\b(university|universit[aeé]|college|institute|laboratory|observatory|\.gov|\.edu|\.ac\.uk|nasa|noaa|esa|department of|ministry of|government|parliament|congress)\b'
    # Social and self-publishing platforms
    - tier: unverified
      pattern: '\b(reddit|youtube|tiktok|facebook|instagram|twitter|substack|medium|blogspot|wordpress|tumblr|quora|pinterest|patreon|linkedin)\b|^r/'
    # US broadcast call signs: KLAS 8 News Now, WMUR, kfvs12.com, WOWK 13 News
    - tier: press
      pattern: '^[kw][a-z]{2,3}\d{0,2}(?:-?(?:tv|dt|am|fm))?\b'
    # Newspaper and broadcaster naming conventions
    - tier: press
      pattern: '\b(news|times|post|herald|tribune|gazette|journal|chronicle|courier|daily|observer|standard|telegraph|examiner|register|dispatch|record|bulletin|sentinel|star|globe|echo|independent|guardian|advertiser|argus|leader|ledger|mercury|patriot|pioneer|press|radio|television|tv|broadcasting|broadcaster|public media|newspaper)\b'
  # Google News only lists outlets it indexes, so an unknown name is more likely a
  # small real newsroom or a content site than a hoax blog. Genre is the honest middle.
  default: genre
