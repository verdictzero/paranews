  # ── Anomalous archaeology and out-of-place artifacts. These beats are fed
  # mainly by Ancient Origins and Ancient Pages, which publish this material
  # daily; the queries below are narrow because the obvious ones do not work.
  # Probed and rejected on 2026-09-08: bare "oopart" returns a Korean mobile
  # game, "crystal skull" returns Indiana Jones, "Baalbek" returns Lebanese war
  # coverage, "el dorado" returns a California county newspaper, and bare
  # "megalith" returns tourism. Every name here is qualified for that reason.
  # topics: auto throughout — the headline decides which beat it lands on.
  # Exoarchaeology. Probed before adding, and the probe rewrote the queries:
