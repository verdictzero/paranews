# Feed registry. Items are the source of truth; clusters are derived at build time.
#
# kind: google-news  -> query + edition build a Google News RSS search. Publisher
#                       tier comes from the `publishers` lookup below.
# kind: rss          -> a direct feed. `tier` applies to every item.
# topics: [..]       -> fixed topic(s), plus any the headline classifier adds.
# topics: auto       -> headline classifier decides; unmatched items use
#                       default_topic, or are dropped when it is absent.
#
# Disabled sources keep a `note` so nobody rediscovers the same dead path.

sources:
  # ── Google News topic queries: the backbone (100 items each, no auth, no bot wall) ──
  - id: gn-ufo-us
    name: Google News · UFO/UAP
    kind: google-news
    edition: US
    query: ufo OR uap OR "unidentified anomalous" OR "unidentified aerial" OR AARO OR "flying saucer"
    topics: [ufo]
    enabled: true
  - id: gn-ufo-gb
    name: Google News · UFO/UAP (UK edition)
    kind: google-news
    edition: GB
    query: ufo OR uap OR "unidentified anomalous" OR "unidentified aerial" OR AARO OR "flying saucer"
    topics: [ufo]
    enabled: true
  # Google News silently drops the when:7d operator on long queries (tested: a
  # 309-character query returned zero recent items, ≤190 characters returned
  # only recent ones), so every beat is split into short queries. Validation
  # enforces the limit.
  - id: gn-ghosts-a-us
    name: Google News · Hauntings (investigations)
    kind: google-news
    edition: US
    # "haunted"/"haunting" alone are metaphor and product magnets (Ponzi frauds haunting
    # the GOP, LEGO Haunted Mansion). Precise phrases only.
    query: poltergeist OR "paranormal investigators" OR "paranormal investigation" OR "ghost sighting" OR "ghost sightings" OR "ghost hunters" OR "ghost hunting" OR exorcism
    topics: [ghosts]
    enabled: true
  - id: gn-ghosts-a-gb
    name: Google News · Hauntings (investigations, UK edition)
    kind: google-news
    edition: GB
    query: poltergeist OR "paranormal investigators" OR "paranormal investigation" OR "ghost sighting" OR "ghost sightings" OR "ghost hunters" OR "ghost hunting" OR exorcism
    topics: [ghosts]
    enabled: true
  - id: gn-ghosts-b-us
    name: Google News · Hauntings (places)
    kind: google-news
    edition: US
    # No "paranormal activity": it is the film franchise nearly every time.
    query: '"reportedly haunted" OR "most haunted" OR "haunted hotel" OR "haunted castle" OR "haunted pub" OR apparition OR "paranormal experience"'
    topics: [ghosts]
    enabled: true
  - id: gn-ghosts-b-gb
    name: Google News · Hauntings (places, UK edition)
    kind: google-news
    edition: GB
    query: '"reportedly haunted" OR "most haunted" OR "haunted hotel" OR "haunted castle" OR apparition OR "paranormal experience" OR "paranormal activity"'
    topics: [ghosts]
    enabled: true
  - id: gn-cryptids-us
    name: Google News · Cryptids
    kind: google-news
    edition: US
    # No "yeti" (coolers), "dogman" (children's books), bare "loch ness" (tourism), "jersey devil" (NHL)
    # or "sea monster" (military hardware nicknames). -brewing keeps Lake Monster Brewing out.
    query: bigfoot OR sasquatch OR cryptid OR cryptids OR cryptozoology OR "loch ness monster" OR nessie OR mothman OR chupacabra OR "lake monster" OR "skunk ape" -brewing
    topics: [cryptids]
    enabled: true
  - id: gn-cryptids-gb
    name: Google News · Cryptids (UK edition)
    kind: google-news
    edition: GB
    query: bigfoot OR sasquatch OR cryptid OR cryptids OR cryptozoology OR "loch ness monster" OR nessie OR mothman OR chupacabra OR "lake monster" OR "skunk ape" -brewing
    topics: [cryptids]
    enabled: true
  - id: gn-fortean-a-us
    name: Google News · High strangeness (phenomena)
    kind: google-news
    edition: US
    query: '"unexplained phenomena" OR "unexplained phenomenon" OR "high strangeness" OR "crop circle" OR "crop circles" OR "mysterious lights" OR "mysterious object"'
    topics: [fortean]
    enabled: true
  - id: gn-fortean-a-gb
    name: Google News · High strangeness (phenomena, UK edition)
    kind: google-news
    edition: GB
    query: '"unexplained phenomena" OR "unexplained phenomenon" OR "high strangeness" OR "crop circle" OR "crop circles" OR "mysterious lights" OR "mysterious object"'
